name: Build J2ME Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 8
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          java -version
          javac -version

      - name: Install Java ME SDK
        run: |
          sudo apt-get install -y libxml2-utils unzip wget
          wget https://download.oracle.com/otn/java/javame/sdk/8.3/b01/me-sdk-8.3-linux-x64.deb -O me-sdk.deb
          sudo dpkg -i me-sdk.deb || sudo apt-get -f install -y

      - name: Compile Java
        run: |
          mkdir -p build/classes
          javac -source 1.3 -target 1.3 \
            -bootclasspath /opt/Java_ME_SDK_8.3/lib/cldc_1.1.jar:/opt/Java_ME_SDK_8.3/lib/midp_2.0.jar \
            -d build/classes *.java

      - name: Preverify
        run: |
          mkdir -p build/preverified
          /opt/Java_ME_SDK_8.3/bin/preverify \
            -classpath /opt/Java_ME_SDK_8.3/lib/cldc_1.1.jar:/opt/Java_ME_SDK_8.3/lib/midp_2.0.jar \
            -d build/preverified build/classes

      - name: Build JAR
        run: |
          mkdir -p build/jar
          cp manifest.mf build/preverified/
          jar cfm build/jar/NokiaGame.jar manifest.mf -C build/preverified .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NokiaGame
          path: build/jar/NokiaGame.jar
