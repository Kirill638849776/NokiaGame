name: Build J2ME Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 8
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk
          java -version
          javac -version

      - name: Download J2ME APIs (MicroEmulator)
        run: |
          mkdir -p j2me
          wget https://repo1.maven.org/maven2/org/microemu/microemu-javase/2.0.4/microemu-javase-2.0.4.jar -O j2me/microemu.jar

      - name: Compile Java
        run: |
          mkdir -p build/classes
          javac -source 1.3 -target 1.3 \
            -bootclasspath j2me/microemu.jar \
            -d build/classes *.java

      - name: Build JAR
        run: |
          mkdir -p build/jar
          cp manifest.mf build/classes/
          jar cfm build/jar/NokiaGame.jar manifest.mf -C build/classes .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NokiaGame
          path: build/jar/NokiaGame.jar
