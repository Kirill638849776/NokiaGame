name: Build J2ME Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 8
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          java -version
          javac -version

      - name: Build J2ME API jar
        run: |
          mkdir -p j2me-api/build
          javac -d j2me-api/build $(find j2me-api/src -name "*.java")
          cd j2me-api/build
          jar cf ../j2me-api.jar .
          cd $GITHUB_WORKSPACE

      - name: Compile game
        run: |
          mkdir -p build/classes
          javac -source 1.3 -target 1.3 \
            -bootclasspath j2me-api/j2me-api.jar \
            -d build/classes *.java

      - name: Build JAR
        run: |
          mkdir -p build/jar
          cp manifest.mf build/classes/
          jar cfm build/jar/NokiaGame.jar manifest.mf -C build/classes .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NokiaGame
          path: build/jar/NokiaGame.jar
