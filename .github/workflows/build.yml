name: Build J2ME Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 8
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk
          java -version
          javac -version

      - name: Compile game (no bootclasspath)
        run: |
          mkdir -p build/classes
          javac \
            -d build/classes \
            *.java

      - name: Build JAR
        run: |
          mkdir -p build/jar
          cp manifest.mf build/classes/
          jar cfm build/jar/NokiaGame.jar manifest.mf -C build/classes .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NokiaGame
          path: build/jar/NokiaGame.jar
