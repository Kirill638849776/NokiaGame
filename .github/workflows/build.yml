name: Build J2ME Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install J2ME tools
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jdk unzip wget
          wget https://downloads.sourceforge.net/project/j2me-wtk/WTK2.5.2_01-linux.zip
          unzip WTK2.5.2_01-linux.zip -d $HOME/wtk

      - name: Compile Java
        run: |
          mkdir -p build/classes
          javac -source 1.3 -target 1.3 \
            -bootclasspath $HOME/wtk/bin/cldcapi11.jar:$HOME/wtk/bin/midpapi20.jar \
            -d build/classes *.java

      - name: Preverify
        run: |
          mkdir -p build/preverified
          $HOME/wtk/bin/preverify \
            -classpath $HOME/wtk/bin/cldcapi11.jar:$HOME/wtk/bin/midpapi20.jar \
            -d build/preverified build/classes

      - name: Build JAR
        run: |
          mkdir -p build/jar
          cp manifest.mf build/preverified/
          jar cfm build/jar/NokiaGame.jar manifest.mf -C build/preverified .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NokiaGame
          path: build/jar/NokiaGame.jar

