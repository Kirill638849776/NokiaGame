name: Build J2ME Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-8-jdk
          java -version
          javac -version

      - name: Download WTK 2.5.2
        run: |
          wget -O wtk.zip https://download.oracle.com/otn/java/javame/sdk/WTK2.5.2_01-linux.zip --no-check-certificate --quiet
          unzip wtk.zip -d wtk

      - name: Extract real CLDC/MIDP API
        run: |
          mkdir -p api
          cp wtk/WTK2.5.2/lib/cldcapi11.jar api/
          cp wtk/WTK2.5.2/lib/midpapi20.jar api/

      - name: Compile game
        run: |
          mkdir -p build/classes
          javac -source 1.3 -target 1.3 \
            -bootclasspath api/cldcapi11.jar:api/midpapi20.jar \
            -classpath api/midpapi20.jar \
            -d build/classes \
            *.java

      - name: Build JAR
        run: |
          mkdir -p build/jar
          cp manifest.mf build/classes/
          jar cfm build/jar/NokiaGame.jar manifest.mf -C build/classes .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NokiaGame
          path: build/jar/NokiaGame.jar
