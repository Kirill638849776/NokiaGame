name: Build J2ME Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java ME SDK 3.0
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-8-jdk
          wget -O jmesdk.zip https://archive.org/download/java-me-sdk-3.0-linux/java_me_sdk-3_0-linux-bin-b06-20_oct_2009.zip
          unzip jmesdk.zip -d jmesdk

      - name: Extract CLDC/MIDP API
        run: |
          mkdir -p api
          cp jmesdk/java_me_sdk-3_0/lib/cldc_1.1.jar api/cldcapi11.jar
          cp jmesdk/java_me_sdk-3_0/lib/midp_2.0.jar api/midpapi20.jar

      - name: Compile game
        run: |
          mkdir -p build/classes
          javac -source 1.3 -target 1.3 \
            -bootclasspath api/cldcapi11.jar:api/midpapi20.jar \
            -classpath api/midpapi20.jar \
            -d build/classes \
            *.java

      - name: Build JAR
        run: |
          mkdir -p build/jar
          cp manifest.mf build/classes/
          jar cfm build/jar/NokiaGame.jar manifest.mf -C build/classes .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NokiaGame
          path: build/jar/NokiaGame.jar
